name: Test Automation Workflow

on:
  workflow_dispatch:
    inputs:
      browser:
        description: "Browser to run tests on"
        required: true
        default: "CHROME"
        type: choice
        options:
          - CHROME
          - FIREFOX
          - EDGE
      isHeadless:
        description: "Run in headless mode?"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"
      isLambdaTest:
        description: "Run on LambdaTest?"
        required: true
        default: "false"
        type: choice
        options:
          - "true"
          - "false"

  schedule:
    - cron: "30 18 * * *"
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Running Test Automation Framework with Maven
      run: mvn test -Dsurefire.suiteXmlFiles=testng.xml -Dbrowser=${{ github.event.inputs.browser }} -DisLambdaTest=${{ github.event.inputs.isLambdaTest }} -DisHeadless=${{ github.event.inputs.isHeadless }}

    - name: Upload Test logs
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: TestLogs
        path: logs/

    - name: Upload Report + Screenshots
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: TestReport
        path: |
          report.html
          screenshots/

    - name: Execution Status
      if: ${{ always() }}
      run: echo "Test Execution Completed"

    - name: Copy Report to gh-pages Folder
      if: ${{ always() }}
      run: |
        mkdir -p public/extent-reports/screenshots
        cp -R report.html public/extent-reports/
        cp -R screenshots/ public/extent-reports/screenshots/
        ls -l public/extent-reports

    - name: Deploy
      if: ${{ always() }}
      uses: JamesIves/github-pages-deploy-action@v4.7.6
      with:
        folder: public/extent-reports/
        token: ${{ secrets.PAT123 }}
        clean: true
